<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carpenters Fiji Loyalty Platform – Production Testing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eff0;--panel:#fff;--ink:#12262b;--mute:#5b7076;--line:#d3dde0;--deep:#0d3b45;--lagoon:#1b7f8c;--pass:#1d7a46;--passbg:#dff3e7;--warn:#a65d00;--warnbg:#fdeccb;--fail:#b3261e;--failbg:#fbdcd9;--info:#34588a;--infobg:#e1eaf7;--r:6px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;line-height:1.15}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
nav{background:var(--deep);color:#d6e8eb;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{padding:0 10px 18px;border-bottom:1px solid #ffffff22;margin-bottom:14px}
nav .brand b{font:700 18px "Bricolage Grotesque",sans-serif;color:#fff;display:block}
nav .brand span{font-size:12.5px;color:#9fc3c9}
.tab{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:inherit;font:inherit;padding:10px 10px 10px 12px;cursor:pointer;border-radius:0 var(--r) var(--r) 0}
.tab:hover{background:#ffffff12}
.tab[aria-selected=true]{background:#ffffff1f;color:#fff;border-left-color:#f2b84b}
.tab:focus-visible,.pill-btn:focus-visible{outline:2px solid #f2b84b;outline-offset:2px}
.tab .t{display:block;font-weight:600}
.tab .s{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#9fc3c9;margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.pass{background:#4cc77f}.dot.warn{background:#f2b84b}.dot.fail{background:#ff7a70}
main{padding:34px clamp(18px,4vw,48px) 60px;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.head h1{font-size:clamp(26px,3.4vw,38px);color:var(--deep)}
.meta{color:var(--mute);font-size:13.5px;margin-top:6px}
.verdict{padding:10px 16px;border-radius:var(--r);font-weight:600;max-width:340px}
.verdict.pass{background:var(--passbg);color:var(--pass)}.verdict.warn{background:var(--warnbg);color:var(--warn)}.verdict.fail{background:var(--failbg);color:var(--fail)}
.purpose{max-width:74ch;margin:18px 0 22px;color:#2c4046}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--lagoon);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:700 24px "Bricolage Grotesque",sans-serif;color:var(--deep)}
.kpi span{font-size:12.5px;color:var(--mute)}
section.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
section.blk h2{font-size:19px;margin-bottom:12px;color:var(--deep)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12.5px;border-bottom:2px solid var(--line);padding:7px 10px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:500}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.pass{background:var(--passbg);color:var(--pass)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.fail{background:var(--failbg);color:var(--fail)}.pill.info{background:var(--infobg);color:var(--info)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:12px;font-size:13.5px}
.track{position:relative;height:26px;background:#eef3f4;border-radius:4px}
.fill{height:100%;border-radius:4px;background:var(--lagoon);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:600;font-size:12.5px;min-width:max-content}
.fill.over{background:var(--fail)}.fill.small{justify-content:flex-start;padding:0 0 0 0}
.out{position:absolute;top:50%;transform:translateY(-50%);margin-left:6px;font-size:12.5px;font-weight:600;color:var(--deep)}
.thr{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--warn)}
.thr i{position:absolute;top:-17px;left:4px;font-size:11.5px;color:var(--warn);font-style:normal;white-space:nowrap}
.legend{font-size:12.5px;color:var(--mute);margin-top:22px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.two>section{margin-bottom:0}
.find{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:var(--r);padding:11px 14px;margin-bottom:10px;background:#fafcfc}
.find.warn{border-left-color:#e09a1a}.find.pass{border-left-color:var(--pass)}.find.fail{border-left-color:var(--fail)}
.find .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:3px}
.find .id{font:600 13px "IBM Plex Sans";color:var(--mute)}
.find b{font-weight:600}
.find p{margin:2px 0 0;color:#2c4046;font-size:14px;max-width:90ch}
.note{background:var(--warnbg);border-radius:var(--r);padding:11px 14px;color:#5c3700;font-size:14px;margin-bottom:18px}
.steps{margin:0;padding-left:0;list-style:none;border-left:2px solid var(--line)}
.steps li{padding:0 0 10px 16px;position:relative}
.steps li:before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--lagoon)}
.steps b{font-variant-numeric:tabular-nums;margin-right:8px}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:22px}
.ovc{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;border-top:4px solid var(--pass)}
.ovc.warn{border-top-color:#e09a1a}.ovc:hover{border-color:var(--lagoon)}
.ovc h3{font-size:17px;margin-bottom:4px}.ovc p{margin:8px 0 0;font-size:13.5px;color:#2c4046}.ovc small{color:var(--mute)}
@media(max-width:820px){
.app{display:block}
nav{position:static;height:auto;padding:12px 8px;display:flex;overflow-x:auto;gap:4px;align-items:stretch}
nav .brand{display:none}
.tab{border-left:0;border-bottom:3px solid transparent;border-radius:var(--r) var(--r) 0 0;width:auto;min-width:150px;flex:none}
.tab[aria-selected=true]{border-bottom-color:#f2b84b}
.bar{grid-template-columns:78px 1fr}
.two{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:no-preference){.panel-in{animation:in .25s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>
<div class="app">
<nav role="tablist" aria-label="Test phases" id="nav">
 <div class="brand"><b>Carpenters Fiji Loyalty</b><span>CS400 production test results<br>Tapnaanshu Lal · 5–6 Oct 2026</span></div>
</nav>
<main id="main" role="tabpanel" tabindex="-1"></main>
</div>

  {t:"Security headers after fix",cols:["Header","API","Frontend"],rows:[["Strict-Transport-Security","max-age=31536000","max-age=31536000"],["X-Content-Type-Options","nosniff","nosniff"],["X-Frame-Options","DENY","SAMEORIGIN"],["Referrer-Policy","no-referrer","strict-origin-when-cross-origin"]]}]},
 {t:"Findings",finds:[
 ["P8-F01","","SuperAdmin had no effective policies","MFA worked but privileged routes returned 403 because the production seeder was disabled (Seed.Enabled defaulted to false). The existing seeder was run through a temporary config, 58 policies were verified, and the config was removed. Four privileged endpoints now return 200.","RESOLVED"],
 ["P8-F02","","Browser security headers missing","HSTS, nosniff, X-Frame-Options and Referrer-Policy were absent on API and frontend. IIS was backed up, headers were configured and externally verified.","RESOLVED"],
 ["P8-O01","","Development config in production publish directory","Remove appsettings.Development.json from production packages and rotate any reused credential.","RECOMMENDATION"],
 ["Limits","","Scope","Not a penetration test. Merchant Admin, Branch Manager and Cashier scope isolation and two-customer IDOR tests were not run. Audit logging was excluded.","LIMITATION"]]}]}
];

const $=s=>document.querySelector(s);
const cls=s=>{s=s.toUpperCase();return /^(PASS|RESOLVED)/.test(s)?(/DEGRADED/.test(s)?"warn":"pass"):/FAIL/.test(s)?"fail":/BASELINE|INFO/.test(s)?"info":/FINDING|NOT VERIFIED|OPEN|LIMITATION|REVIEW|RECOMMEND|MEDIUM|LOW/.test(s)?"warn":""};
const pill=s=>{const c=cls(s);return c?`<span class="pill ${c}">${s}</span>`:s};
const isStatus=v=>/^(PASS|FAIL|RESOLVED|BASELINE|INFO|FINDING|NOT VERIFIED|OPEN|LIMITATION|RECOMMENDATION)/.test(v);

function table(b){return `<div class="scroll"><table><thead><tr>${b.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(v=>`<td>${isStatus(v)?pill(v):v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}

function bars(b){
  const vals=b.bars.map(x=>x[1]);const max=Math.max(...vals,b.thr?b.thr*1.12:0);
  return `<div class="bars" ${b.thr?'style="margin-top:20px"':''}>${b.bars.map(([l,v])=>{
    const w=v/max*100,over=b.thr&&v>b.thr,txt=(v>=100?v.toLocaleString(undefined,{maximumFractionDigits:2}):v)+b.unit;
    return `<div class="bar"><span>${l}</span><div class="track"><div class="fill ${over?"over":""}" style="width:${Math.max(w,1.5)}%">${w>28?txt:""}</div>${w>28?"":`<span class="out" style="left:${w}%">${txt}</span>`}${b.thr?`<div class="thr" style="left:${b.thr/max*100}%">${l===b.bars[0][0]?`<i>target ${b.thr}${b.unit}</i>`:""}</div>`:""}</div></div>`}).join("")}</div>${b.note?`<p class="legend">${b.note}</p>`:""}`}

function finds(b){return b.finds.map(([id,sev,t,p,st])=>`<div class="find ${cls(st)}"><div class="top"><span class="id">${id}</span><b>${t}</b>${pill(st)}${sev?pill(sev):""}</div><p>${p}</p></div>`).join("")}
function steps(b){return `<ul class="steps">${b.steps.map(([a,t])=>`<li><b>${a}</b>${t}</li>`).join("")}</ul>`}

function block(b){
  if(b.note&&!b.t&&!b.bars)return `<div class="note">${b.note}</div>`;
  if(b.two)return `<div class="two">${b.two.map(block).join("")}</div>`;
  const inner=b.cols?table(b):b.bars?bars(b):b.finds?finds(b):b.steps?steps(b):"";
  return `<section class="blk"><h2>${b.t}</h2>${inner}</section>`}

function overview(){
  const n=T.length;
  return `<div class="head"><div><h1>Production testing overview</h1><div class="meta">Carpenters Fiji Coalition Loyalty Program · CS400 Industry Experience Project · Azure Windows Server / IIS / SQL Server</div></div></div>
  <p class="purpose">Six production test phases ran on 5–6 October 2026. Select a phase below or in the sidebar for full results.</p>
  <div class="kpis"><div class="kpi"><b>${n}</b><span>Test phases completed</span></div><div class="kpi"><b>5 of 6</b><span>Clean PASS or PASS with fixes retested</span></div><div class="kpi"><b>500 VUs</b><span>Highest sustained load passed</span></div><div class="kpi"><b>0</b><span>Open critical findings</span></div></div>
  <div class="ov">${T.map(t=>`<button class="ovc ${t.st}" data-go="${t.id}"><h3>${t.label}</h3><small>${t.date}</small><p><span class="pill ${t.st}">${t.verdict}</span></p><p>${t.summary}</p></button>`).join("")}</div>
  <section class="blk"><h2>Items to carry forward</h2>
  <div class="find warn"><div class="top"><b>Spike latency</b>${pill("FINDING")}</div><p>A 20→500 VU surge pushed P95 to 789.40 ms (target 500 ms). Add telemetry for SQL pool usage, request queueing and wait statistics.</p></div>
  <div class="find warn"><div class="top"><b>Blob Storage not configured in the API</b>${pill("OPEN / MONITOR")}</div><p>Application-to-Blob integration remains unverified.</p></div>
  <div class="find warn"><div class="top"><b>Startup dependency on SQL</b>${pill("OPEN / MONITOR")}</div><p>Mitigated by the dependency-aware boot task; app-level retry/backoff is still recommended.</p></div>
  <div class="find warn"><div class="top"><b>Test coverage</b>${pill("LIMITATION")}</div><p>Load, stress and soak runs targeted /api/health only. Authenticated, transactional workloads still need their own scenarios.</p></div></section>`}

function view(id){
  if(id==="overview")return overview();
  const t=T.find(x=>x.id===id);
  return `<div class="head"><div><h1>${t.label}</h1><div class="meta">Tested ${t.date}${t.id==="recovery"?"":" · Prepared by Tapnaanshu Lal"}</div></div><div class="verdict ${t.st}">${t.verdict}</div></div>
  <p class="purpose">${t.purpose}</p><div class="kpis">${t.kpis.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("")}</div>${t.blocks.map(block).join("")}`}

const nav=$("#nav"),main=$("#main");
const all=[{id:"overview",label:"Overview",st:"",sub:"All six phases"},...T.map(t=>({id:t.id,label:t.label,st:t.st,sub:t.verdict.split(" – ")[0]}))];
nav.insertAdjacentHTML("beforeend",all.map(a=>`<button class="tab" role="tab" id="tab-${a.id}" data-id="${a.id}"><span class="t">${a.label}</span><span class="s">${a.st?`<i class="dot ${a.st}"></i>`:""}${a.sub}</span></button>`).join(""));

function show(id,push){
  if(!all.some(a=>a.id===id))id="overview";
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));
  main.innerHTML=`<div class="panel-in">${view(id)}</div>`;
  main.setAttribute("aria-labelledby","tab-"+id);
  if(push!==false)history.replaceState(null,"","#"+id);
  window.scrollTo(0,0);
  document.getElementById("tab-"+id).scrollIntoView({block:"nearest",inline:"nearest"});
}
nav.addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)show(b.dataset.id)});
main.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)show(b.dataset.go)});
nav.addEventListener("keydown",e=>{
  const ids=all.map(a=>a.id),cur=ids.indexOf(location.hash.slice(1)>""?location.hash.slice(1):"overview");
  let n=null;
  if(e.key==="ArrowDown"||e.key==="ArrowRight")n=(cur+1)%ids.length;
  if(e.key==="ArrowUp"||e.key==="ArrowLeft")n=(cur-1+ids.length)%ids.length;
  if(n!==null){e.preventDefault();show(ids[n]);document.getElementById("tab-"+ids[n]).focus()}
});
addEventListener("hashchange",()=>show(location.hash.slice(1),false));
show(location.hash.slice(1)||"overview",false);
</script>
</body>
</html>
